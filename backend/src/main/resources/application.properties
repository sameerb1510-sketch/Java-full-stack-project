spring.application.name=gym-membership
server.port=8080

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/gym_membership}
spring.datasource.username=${MYSQL_USER:gym_app}
spring.datasource.password=${MYSQL_PASSWORD:replace-with-your-local-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
