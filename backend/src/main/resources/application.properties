spring.application.name=gym-membership
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL_JDBC:${MYSQL_URL:jdbc:mysql://localhost:3306/gym_membership}}
spring.datasource.username=${DB_USER:${MYSQL_USER:gym_app}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:replace-with-your-local-password}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
