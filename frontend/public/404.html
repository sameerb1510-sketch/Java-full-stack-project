<!doctype html>
<html><head><meta charset="utf-8"><title>Loading…</title></head>
<body><script>
  const parts = location.pathname.split('/').filter(Boolean)
  const base = parts.length ? `/${parts[0]}` : ''
  const route = location.pathname.slice(base.length) || '/'
  location.replace(`${location.origin}${base}/?redirect=${encodeURIComponent(route + location.search + location.hash)}`)
</script></body></html>
