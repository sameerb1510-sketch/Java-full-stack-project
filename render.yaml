databases:
  - name: forge-fitness-db
    databaseName: gym_membership
    user: gym_app
    plan: free
    region: ohio

services:
  - type: web
    name: forge-fitness-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /plans
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forge-fitness-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: forge-fitness-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: forge-fitness-db
          property: password
      - key: FRONTEND_ORIGINS
        value: https://forge-fitness-web-bj1w.onrender.com,https://sameerb1510-sketch.github.io

  - type: web
    name: forge-fitness-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: forge-fitness-api
          envVarKey: RENDER_EXTERNAL_URL
